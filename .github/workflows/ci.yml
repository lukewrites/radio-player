name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: List available simulators
        run: xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; [print(k,v[0]['name']) for k,v in d.items() if v and 'iPhone' in v[0].get('name','')]" 2>/dev/null || true

      - name: Build for iOS Simulator
        run: >
          xcodebuild
          -project RadioPlayerApp.xcodeproj
          -scheme RadioPlayerApp
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          build
          CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build for macOS
        run: >
          xcodebuild
          -project RadioPlayerApp.xcodeproj
          -scheme RadioPlayerApp
          -destination 'platform=macOS'
          -configuration Debug
          build
          CODE_SIGNING_ALLOWED=NO
