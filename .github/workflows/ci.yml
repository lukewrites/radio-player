name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project RadioPlayerApp.xcodeproj \
            -scheme RadioPlayerApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  ui-tests:
    name: UI Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Select available iPhone simulator
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | sort -t' ' -k2 -rn | head -1 | xargs)
          echo "Selected simulator: $SIM_NAME"
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project RadioPlayerApp.xcodeproj \
            -scheme RadioPlayerApp \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest' \
            -only-testing:RadioPlayerUITests \
            CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for macOS
        run: |
          xcodebuild \
            -project RadioPlayerApp.xcodeproj \
            -scheme RadioPlayerApp \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
