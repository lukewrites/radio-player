name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show available schemes and SDKs
        run: |
          echo "=== Schemes ==="
          xcodebuild -project RadioPlayerApp.xcodeproj -list
          echo "=== SDKs ==="
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Select latest available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          DEVICES_JSON="$(xcrun simctl list devices available -j)"
          UDID="$(
            ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              devs = data["devices"].values.flatten.select { |d|
                d["isAvailable"] && d["name"].start_with?("iPhone")
              }
              scored = devs.map { |d|
                m = d["name"].match(/^iPhone\s+(\d+)/)
                next nil unless m
                n = m[1].to_i
                pro_bonus = (d["name"].include?("Pro") ? 1 : 0)
                max_bonus = (d["name"].include?("Max") ? 1 : 0)
                [n, pro_bonus, max_bonus, d]
              }.compact
              best = scored.max_by { |n, pro, max, d| [n, pro, max] }
              puts(best[3]["udid"]) if best
            ' <<< "$DEVICES_JSON"
          )"
          if [ -z "${UDID:-}" ]; then
            echo "No numeric iPhone simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project RadioPlayerApp.xcodeproj \
            -scheme RadioPlayerApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  ui-tests:
    name: UI Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Select latest available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          DEVICES_JSON="$(xcrun simctl list devices available -j)"
          UDID="$(
            ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              devs = data["devices"].values.flatten.select { |d|
                d["isAvailable"] && d["name"].start_with?("iPhone")
              }
              scored = devs.map { |d|
                m = d["name"].match(/^iPhone\s+(\d+)/)
                next nil unless m
                n = m[1].to_i
                pro_bonus = (d["name"].include?("Pro") ? 1 : 0)
                max_bonus = (d["name"].include?("Max") ? 1 : 0)
                [n, pro_bonus, max_bonus, d]
              }.compact
              best = scored.max_by { |n, pro, max, d| [n, pro, max] }
              puts(best[3]["udid"]) if best
            ' <<< "$DEVICES_JSON"
          )"
          if [ -z "${UDID:-}" ]; then
            echo "No numeric iPhone simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project RadioPlayerApp.xcodeproj \
            -scheme RadioPlayerApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RadioPlayerUITests \
            CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for macOS
        run: |
          xcodebuild \
            -project RadioPlayerApp.xcodeproj \
            -scheme RadioPlayerApp \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
