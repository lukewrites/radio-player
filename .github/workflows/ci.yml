name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build for iOS Simulator
        run: >
          xcodebuild
          -project RadioPlayerApp.xcodeproj
          -scheme RadioPlayerApp
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -configuration Debug
          build
          CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build for macOS
        run: >
          xcodebuild
          -project RadioPlayerApp.xcodeproj
          -scheme RadioPlayerApp
          -destination 'platform=macOS'
          -configuration Debug
          build
          CODE_SIGNING_ALLOWED=NO
